<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection & AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #efeae2;
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-[#005c4b] text-white p-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-gray-300 text-black rounded-full p-2 font-bold">🤖</div>
            <div>
                <h1 class="font-bold text-base">Data Collection & AI</h1>
                <p class="text-xs text-green-200" id="currentAssetDisplay">Asset: Select Asset</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <select id="assetDropdown" class="bg-[#007b65] text-white text-sm px-2 py-1 rounded border-none focus:outline-none" onchange="updateAsset()">
                <option value="">Select Asset</option>
            </select>
            <button onclick="createNewAsset()" class="bg-[#007b65] hover:bg-[#004d40] text-white font-bold px-3 py-1 rounded text-lg">+</button>
        </div>
    </header>

    <!-- Chat Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex justify-start">
            <div class="bg-white text-black p-3 rounded-lg shadow max-w-xs sm:max-w-md text-sm">
                <p>Namaste! Main aapka AI assistant hoon. Bataiye, aaj main aapki kya madad kar sakta hoon?</p>
            </div>
        </div>
    </div>

    <!-- WhatsApp Style Media Preview Modal -->
    <div id="mediaModal" class="hidden fixed inset-0 bg-black/80 z-50 flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white">
            <span class="font-bold text-base">Preview Photo</span>
            <button onclick="closeModal()" class="text-white text-2xl font-bold">&times;</button>
        </div>
        <div class="flex-1 flex items-center justify-center p-2">
            <img id="modalImagePreview" class="max-h-[70vh] rounded-lg shadow-lg object-contain">
        </div>
        <div class="bg-[#202c33] p-3 rounded-lg flex items-center space-x-2">
            <input type="text" id="modalCaptionInput" placeholder="Add a caption..." class="flex-1 bg-[#2a3942] text-white placeholder-gray-400 px-4 py-2 rounded-full text-sm focus:outline-none">
            <button onclick="sendSelectedImage()" class="bg-[#00a884] hover:bg-[#008f6f] text-white p-3 rounded-full flex items-center justify-center shadow-lg">
                ➤
            </button>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden text-center py-1 bg-white/80 text-xs font-semibold text-gray-700">
        AI is thinking...
    </div>

    <!-- Input Footer -->
    <footer class="bg-[#f0f2f5] p-3 flex items-center space-x-2">
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
        <button onclick="checkAssetAndTriggerUpload()" class="bg-gray-200 hover:bg-gray-300 p-2 rounded-full text-gray-700" title="Select photo">
            📎
        </button>
        <input type="text" id="userInput" placeholder="Type a message..." class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none" onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" class="bg-[#00a884] hover:bg-[#008f6f] text-white p-2 rounded-full">
            ➤
        </button>
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOk2IuD_9YmJVzB7QV-8eMLr1V3ncgRvdjfXybSTB1rrPMH59tIHejRGEQ00B0R5AHZg/exec";
        let selectedAsset = "";
        let currentFile = null;
        let currentBase64 = null;

        window.onload = function() {
            fetchFolders();
        }

        function updateAsset() {
            const dropdown = document.getElementById("assetDropdown");
            selectedAsset = dropdown.value;
            document.getElementById("currentAssetDisplay").innerText = "Asset: " + (selectedAsset || "None");
        }

        function createNewAsset() {
            let newAsset = prompt("Enter new Asset Code / Name:");
            if (newAsset) {
                selectedAsset = newAsset.trim();
                let dropdown = document.getElementById("assetDropdown");
                let option = document.createElement("option");
                option.value = selectedAsset;
                option.text = selectedAsset;
                dropdown.add(option);
                dropdown.value = selectedAsset;
                updateAsset();
            }
        }

        async function fetchFolders() {
            try {
                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getFolders" })
                });
                let result = await response.json();
                if (result.success && result.folders) {
                    let dropdown = document.getElementById("assetDropdown");
                    result.folders.forEach(folder => {
                        let option = document.createElement("option");
                        option.value = folder;
                        option.text = folder;
                        dropdown.add(option);
                    });
                }
            } catch (err) {
                console.error("Error fetching folders:", err);
            }
        }

        function checkAssetAndTriggerUpload() {
            if (!selectedAsset) {
                alert("Pehle upar se Asset select karein ya naya banayein!");
                return;
            }
            document.getElementById('fileInput').click();
        }

        function handleImageSelection(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            currentFile = files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                currentBase64 = e.target.result.split(',')[1];
                document.getElementById("modalImagePreview").src = e.target.result;
                document.getElementById("modalCaptionInput").value = "";
                document.getElementById("mediaModal").classList.remove("hidden");
            };
            reader.readAsDataURL(currentFile);
            event.target.value = ""; // reset input
        }

        function closeModal() {
            document.getElementById("mediaModal").classList.add("hidden");
            currentFile = null;
            currentBase64 = null;
        }

        async function sendSelectedImage() {
            if (!currentFile || !currentBase64) return;

            const caption = document.getElementById("modalCaptionInput").value.trim();
            const fullDataUrl = document.getElementById("modalImagePreview").src;
            closeModal();

            // Append image with WhatsApp progress bar layout
            const msgId = "msg_" + Date.now();
            appendMediaMessageWithProgress(fullDataUrl, caption, msgId, 'user');

            // Upload to Google Drive with simulated/real progress
            await uploadToDriveWithProgress(currentFile, selectedAsset, msgId);
        }

        async function uploadToDriveWithProgress(file, assetCode, msgId) {
            let progressBar = document.getElementById(`progress_${msgId}`);
            let progressText = document.getElementById(`progresstext_${msgId}`);
            let statusIcon = document.getElementById(`status_${msgId}`);

            // Simulate smooth progress animation while uploading
            let progress = 10;
            let interval = setInterval(() => {
                if (progress < 90) {
                    progress += 15;
                    if (progressBar) progressBar.style.width = progress + "%";
                    if (progressText) progressText.innerText = progress + "%";
                }
            }, 200);

            let payload = {
                action: "upload",
                assetCode: assetCode,
                fileName: file.name,
                mimeType: file.type,
                base64Data: currentBase64
            };

            try {
                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let result = await response.json();

                clearInterval(interval);
                if (progressBar) progressBar.style.width = "100%";
                if (progressText) progressText.innerText = "100%";

                setTimeout(() => {
                    let progressContainer = document.getElementById(`progress_container_${msgId}`);
                    if (progressContainer) progressContainer.style.display = 'none';
                    if (statusIcon) statusIcon.innerHTML = " ✓✓"; // WhatsApp blue-style ticks
                }, 500);

                if (result.success) {
                    // Automatically trigger Gemini chat with the image for AI analysis
                    triggerGeminiVisionAnalysis(currentBase64, file.type, captionText || "Please analyze this image.");
                } else {
                    alert("Upload failed: " + result.error);
                }
            } catch (err) {
                clearInterval(interval);
                alert("Upload Exception: " + err.toString());
            }
        }

        let captionText = "";
        async function triggerGeminiVisionAnalysis(base64Img, mime, queryText) {
            document.getElementById("loadingIndicator").classList.remove("hidden");
            try {
                let payload = {
                    action: "geminiChat",
                    message: queryText,
                    base64Image: base64Img,
                    mimeType: mime
                };

                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                let result = await response.json();
                document.getElementById("loadingIndicator").classList.add("hidden");

                if (result.success) {
                    let formattedReply = formatGeminiOutput(result.reply);
                    appendMessage(formattedReply, 'html', 'bot');
                } else {
                    appendMessage("Error: " + result.error, 'text', 'bot');
                }
            } catch (err) {
                document.getElementById("loadingIndicator").classList.add("hidden");
                appendMessage("Network Exception: " + err.toString(), 'text', 'bot');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'text', 'user');
            input.value = "";

            document.getElementById("loadingIndicator").classList.remove("hidden");

            try {
                let payload = {
                    action: "geminiChat",
                    message: query
                };

                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                let result = await response.json();
                document.getElementById("loadingIndicator").classList.add("hidden");

                if (result.success) {
                    let formattedReply = formatGeminiOutput(result.reply);
                    appendMessage(formattedReply, 'html', 'bot');
                } else {
                    appendMessage("Error: " + result.error, 'text', 'bot');
                }
            } catch (err) {
                document.getElementById("loadingIndicator").classList.add("hidden");
                appendMessage("Network Exception: " + err.toString(), 'text', 'bot');
            }
        }

        function formatGeminiOutput(text) {
            let htmlContent = text.replace(/\n/g, '<br>');
            return `<div class="text-xs space-y-2">${htmlContent}</div>
            <div class="flex space-x-2 mt-2 pt-2 border-t border-gray-200">
                <button onclick="copyReplyText(this)" class="bg-gray-200 hover:bg-gray-300 text-black px-2 py-1 rounded text-xs font-semibold">📋 Copy Text</button>
                <button onclick="shareReplyText(this)" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-semibold">📤 Share</button>
            </div>`;
        }

        function copyReplyText(btn) {
            let container = btn.parentElement.previousElementSibling;
            navigator.clipboard.writeText(container.innerText).then(() => {
                alert("Text copied to clipboard!");
            });
        }

        function shareReplyText(btn) {
            let container = btn.parentElement.previousElementSibling;
            let text = container.innerText;
            if (navigator.share) {
                navigator.share({ title: 'AI Response', text: text }).catch(err => console.log(err));
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            }
        }

        function appendMediaMessageWithProgress(imgSrc, caption, msgId, sender) {
            const container = document.getElementById("chatContainer");
            const msgDiv = document.createElement("div");
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement("div");
            innerDiv.className = `p-2 rounded-lg shadow max-w-xs sm:max-w-md text-sm ${sender === 'user' ? 'bg-[#d9fdd3] text-black' : 'bg-white text-black'}`;

            captionText = caption;
            let captionHtml = caption ? `<p class="mt-1 px-1 text-xs">${caption}</p>` : '';

            innerDiv.innerHTML = `
                <div class="relative rounded overflow-hidden">
                    <img src="${imgSrc}" class="rounded max-h-48 object-cover w-full">
                    <div id="progress_container_${msgId}" class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center text-white">
                        <div class="w-3/4 bg-gray-300 rounded-full h-2 mb-1 overflow-hidden">
                            <div id="progress_${msgId}" class="bg-green-500 h-full w-[10%] transition-all duration-200"></div>
                        </div>
                        <span id="progresstext_${msgId}" class="text-xs font-bold">10%</span>
                    </div>
                </div>
                ${captionHtml}
                <div class="text-right text-[10px] text-gray-500 mt-1"><span id="status_${msgId}">🕒</span></div>
            `;

            msgDiv.appendChild(innerDiv);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(content, type, sender) {
            const container = document.getElementById("chatContainer");
            const msgDiv = document.createElement("div");
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement("div");
            innerDiv.className = `p-3 rounded-lg shadow max-w-xs sm:max-w-md text-sm ${sender === 'user' ? 'bg-[#d9fdd3] text-black' : 'bg-white text-black'}`;

            if (type === 'html') {
                innerDiv.innerHTML = content;
            } else {
                innerDiv.innerText = content;
            }

            msgDiv.appendChild(innerDiv);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
