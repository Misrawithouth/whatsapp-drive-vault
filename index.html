<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection & AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js for Local Browser OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body {
            background-color: #efeae2;
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-[#005c4b] text-white p-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-gray-300 text-black rounded-full p-2 font-bold">🤖</div>
            <div>
                <h1 class="font-bold text-base">Data Collection & AI</h1>
                <p class="text-xs text-green-200" id="currentAssetDisplay">Asset: Select Asset</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <select id="assetDropdown" class="bg-[#007b65] text-white text-sm px-2 py-1 rounded border-none focus:outline-none" onchange="updateAsset()">
                <option value="">Select Asset</option>
            </select>
            <button onclick="createNewAsset()" class="bg-[#007b65] hover:bg-[#004d40] text-white font-bold px-3 py-1 rounded text-lg">+</button>
        </div>
    </header>

    <!-- Chat Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex justify-start">
            <div class="bg-white text-black p-3 rounded-lg shadow max-w-xs text-sm">
                <p>Namaste! Ek ya ek se zyada logsheet ki photo select karein aur table format mein data praapt karein.</p>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden text-center py-1 bg-white/80 text-xs font-semibold text-gray-700">
        Enhancing image & processing handwritten text locally via Tesseract OCR...
    </div>

    <!-- Input Footer -->
    <footer class="bg-[#f0f2f5] p-3 flex items-center space-x-2">
        <!-- Added 'multiple' attribute for multi-photo selection -->
        <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="handleImageSelection(event)">
        <button onclick="document.getElementById('fileInput').click()" class="bg-gray-200 hover:bg-gray-300 p-2 rounded-full text-gray-700" title="Select multiple photos">
            📎
        </button>
        <input type="text" id="userInput" placeholder="Type 'table' to extract data..." class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none">
        <button onclick="sendMessage()" class="bg-[#00a884] hover:bg-[#008f6f] text-white p-2 rounded-full">
            ➤
        </button>
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwyTg3ejnUFC4Tei7trpTUf76WAJ2eKZtMYF_bU_DMjTZndTZApm9jNsV8UbPM79uz7nw/exec";
        let selectedAsset = "";
        let uploadedImages = []; // Array to support multiple images

        window.onload = function() {
            fetchFolders();
        }

        function updateAsset() {
            const dropdown = document.getElementById("assetDropdown");
            selectedAsset = dropdown.value;
            document.getElementById("currentAssetDisplay").innerText = "Asset: " + (selectedAsset || "None");
        }

        function createNewAsset() {
            let newAsset = prompt("Enter new Asset Code / Name:");
            if (newAsset) {
                selectedAsset = newAsset.trim();
                let dropdown = document.getElementById("assetDropdown");
                let option = document.createElement("option");
                option.value = selectedAsset;
                option.text = selectedAsset;
                dropdown.add(option);
                dropdown.value = selectedAsset;
                updateAsset();
            }
        }

        async function fetchFolders() {
            try {
                let response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getFolders" })
                });
                let result = await response.json();
                if (result.success && result.folders) {
                    let dropdown = document.getElementById("assetDropdown");
                    result.folders.forEach(folder => {
                        let option = document.createElement("option");
                        option.value = folder;
                        option.text = folder;
                        dropdown.add(option);
                    });
                }
            } catch (err) {
                console.error("Error fetching folders:", err);
            }
        }

        // Handle multiple file selections
        function handleImageSelection(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            if (!selectedAsset) {
                alert("Pehle upar se Asset select karein ya naya banayein!");
                return;
            }

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push(e.target.result);
                    appendMessage(e.target.result, 'image', 'user');
                    uploadToDrive(file, selectedAsset);
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadToDrive(file, assetCode) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                let base64Data = e.target.result.split(',')[1];
                let payload = {
                    action: "upload",
                    assetCode: assetCode,
                    fileName: file.name,
                    mimeType: file.type,
                    base64Data: base64Data
                };

                try {
                    let response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    let result = await response.json();
                    if (result.success) {
                        appendMessage(`✅ Uploaded to: ${assetCode}`, 'text', 'bot');
                    } else {
                        appendMessage(`❌ Upload failed: ${result.error}`, 'text', 'bot');
                    }
                } catch (err) {
                    appendMessage(`❌ Upload Exception: ${err.toString()}`, 'text', 'bot');
                }
            };
            reader.readAsDataURL(file);
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'text', 'user');
            input.value = "";

            if (uploadedImages.length > 0 && (query.toLowerCase().includes("table") || query.toLowerCase().includes("data") || query.toLowerCase().includes("ocr") || query.toLowerCase().includes("do"))) {
                document.getElementById("loadingIndicator").classList.remove("hidden");
                try {
                    // Process the latest uploaded image with canvas preprocessing for handwriting clarity
                    const latestImageSrc = uploadedImages[uploadedImages.length - 1];
                    const processedImageUrl = await preprocessImageForHandwriting(latestImageSrc);
                    
                    const result = await Tesseract.recognize(processedImageUrl, 'eng');
                    document.getElementById("loadingIndicator").classList.add("hidden");
                    
                    let tableHtml = formatTextToMarkdownTable(result.data.text);
                    appendMessage(tableHtml, 'html', 'bot');
                } catch (err) {
                    document.getElementById("loadingIndicator").classList.add("hidden");
                    appendMessage("Local OCR Error: " + err.toString(), 'text', 'bot');
                }
            } else {
                appendMessage("Kripya pehle logsheet image upload karein aur table format ki maang karein.", 'text', 'bot');
            }
        }

        // Preprocess image to enhance handwriting recognition (Grayscale & Contrast boost)
        function preprocessImageForHandwriting(imageSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Draw original image
                    ctx.drawImage(img, 0, 0);
                    
                    // Get image data for contrast enhancement
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    // Simple contrast and grayscale boost for pen ink
                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        // Increase contrast
                        let newVal = avg < 160 ? 0 : 255; // Thresholding for crisp pen strokes
                        data[i] = newVal;     // R
                        data[i + 1] = newVal; // G
                        data[i + 2] = newVal; // B
                    }
                    
                    ctx.putImageData(imgData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                img.src = imageSrc;
            });
        }

        function formatTextToMarkdownTable(rawText) {
            let lines = rawText.split('\n').filter(line => line.trim() !== "");
            let tableId = "table_" + Date.now();
            
            let tableHtml = `<div class="overflow-x-auto mb-2"><table id="${tableId}" class="min-w-full border-collapse border border-gray-300 text-xs bg-white text-black">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border border-gray-300 px-2 py-1 text-left">Detected Line / Field</th>
                        <th class="border border-gray-300 px-2 py-1 text-left">Extracted Value</th>
                    </tr>
                </thead>
                <tbody>`;
            
            lines.forEach((line, index) => {
                tableHtml += `<tr>
                    <td class="border border-gray-300 px-2 py-1 font-medium">Row ${index + 1}</td>
                    <td class="border border-gray-300 px-2 py-1">${line}</td>
                </tr>`;
            });
            
            tableHtml += `</tbody></table></div>`;
            
            // Add Export / Sharing toolbar buttons
            tableHtml += `<div class="flex space-x-2 mt-1">
                <button onclick="copyTableText('${tableId}')" class="bg-gray-200 hover:bg-gray-300 text-black px-2 py-1 rounded text-xs font-semibold">📋 Copy Text</button>
                <button onclick="shareTableData('${tableId}')" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-semibold">📤 Share Table</button>
            </div>`;

            return tableHtml;
        }

        // Copy Table Data to Clipboard
        function copyTableText(tableId) {
            const table = document.getElementById(tableId);
            let text = "";
            for (let row of table.rows) {
                let rowData = [];
                for (let cell of row.cells) {
                    rowData.push(cell.innerText);
                }
                text += rowData.join("\t") + "\n";
            }
            navigator.clipboard.writeText(text).then(() => {
                alert("Table text copied to clipboard!");
            });
        }

        // Share Table via Web Share API or WhatsApp
        function shareTableData(tableId) {
            const table = document.getElementById(tableId);
            let text = "Logsheet Data:\n";
            for (let row of table.rows) {
                let rowData = [];
                for (let cell of row.cells) {
                    rowData.push(cell.innerText);
                }
                text += rowData.join(" | ") + "\n";
            }

            if (navigator.share) {
                navigator.share({
                    title: 'Logsheet Data',
                    text: text
                }).catch(err => console.log('Sharing failed', err));
            } else {
                // Fallback to WhatsApp share
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, '_blank');
            }
        }

        function appendMessage(content, type, sender) {
            const container = document.getElementById("chatContainer");
            const msgDiv = document.createElement("div");
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement("div");
            innerDiv.className = `p-3 rounded-lg shadow max-w-xs sm:max-w-md text-sm ${sender === 'user' ? 'bg-[#d9fdd3] text-black' : 'bg-white text-black'}`;

            if (type === 'image') {
                innerDiv.innerHTML = `<img src="${content}" class="rounded max-h-48 object-cover">`;
            } else if (type === 'html') {
                innerDiv.innerHTML = content;
            } else {
                innerDiv.innerText = content;
            }

            msgDiv.appendChild(innerDiv);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
