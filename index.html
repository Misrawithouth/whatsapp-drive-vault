<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Data Collection PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075E54">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-bg {
      background-color: #efeae2;
      background-image: radial-gradient(#d1c7bd 1px, transparent 0);
      background-size: 16px 16px;
    }
    .bubble-out { background-color: #dcf8c6; }
    .bubble-in { background-color: #ffffff; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-[#075e54] text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-lg">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Data Collection Vault</h1>
        <p class="text-xs text-emerald-200" id="status-indicator">Connected to GAS Backend</p>
      </div>
    </div>

    <!-- ASSET SELECTOR DROPDOWN -->
    <div class="flex items-center space-x-2">
      <select id="assetSelect" class="bg-[#128c7e] text-white text-xs rounded px-2 py-1.5 focus:outline-none border border-emerald-600 max-w-[130px]">
        <option value="">Loading Assets...</option>
      </select>
      <button onclick="createNewAssetFolder()" class="bg-[#25d366] hover:bg-green-600 text-white rounded-full w-7 h-7 flex items-center justify-center shadow">
        <i class="fa-solid fa-plus text-xs"></i>
      </button>
    </div>
  </header>

  <!-- CHAT MESSAGES AREA -->
  <main id="chatStream" class="flex-1 overflow-y-auto p-4 chat-bg space-y-3">
    <!-- Messages appended dynamically -->
  </main>

  <!-- BOTTOM INPUT BAR -->
  <footer class="bg-gray-100 p-2 flex items-center space-x-2 border-t border-gray-300">
    <button onclick="document.getElementById('fileInput').click()" class="text-gray-600 hover:text-emerald-700 p-2 text-xl">
      <i class="fa-solid fa-paperclip"></i>
    </button>
    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
    
    <input type="text" id="messageInput" placeholder="Type a message or asset query..." 
           class="flex-1 bg-white rounded-full px-4 py-2 text-sm focus:outline-none shadow-inner border border-gray-200"
           onkeypress="if(event.key === 'Enter') sendTextMessage()">

    <button onclick="sendTextMessage()" class="bg-[#128c7e] hover:bg-[#075e54] text-white rounded-full w-10 h-10 flex items-center justify-center shadow">
      <i class="fa-solid fa-paper-plane text-sm"></i>
    </button>
  </footer>

  <!-- MEDIA PREVIEW MODAL -->
  <div id="mediaModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4">
    <div class="flex justify-between items-center text-white">
      <span class="text-sm font-semibold">Image Preview</span>
      <button onclick="closeModal()" class="text-white text-2xl">&times;</button>
    </div>
    
    <div class="flex-1 flex items-center justify-center my-4 overflow-hidden">
      <img id="modalImgPreview" src="" class="max-h-full max-w-full object-contain rounded">
    </div>

    <div class="flex items-center space-x-2">
      <input type="text" id="modalCaption" placeholder="Add a caption / prompt..." 
             class="flex-1 bg-gray-800 text-white rounded-full px-4 py-2 text-sm focus:outline-none border border-gray-700">
      <button onclick="confirmMediaUpload()" class="bg-[#25d366] hover:bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // YOUR CONFIGURED GAS WEB APP URL:
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOk2IuD_9YmJVzB7QV-8eMLr1V3ncgRvdjfXybSTB1rrPMH59tIHejRGEQ00B0R5AHZg/exec";

    let selectedImageBase64 = null;
    let selectedImageMime = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadChatHistory();
      fetchAssetFolders();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      }
    });

    async function fetchAssetFolders() {
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getFolders' })
        });
        const result = await res.json();
        if (result.status === 'success') {
          const select = document.getElementById('assetSelect');
          select.innerHTML = '<option value="">Select Asset</option>';
          result.data.forEach(folder => {
            select.innerHTML += `<option value="${folder.id}">${folder.name}</option>`;
          });
        }
      } catch (e) {
        console.error('Error fetching folders:', e);
      }
    }

    async function createNewAssetFolder() {
      const folderName = prompt('Enter New Asset Code / Name:');
      if (!folderName) return;

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'createFolder', folderName: folderName })
        });
        const result = await res.json();
        if (result.status === 'success') {
          await fetchAssetFolders();
          document.getElementById('assetSelect').value = result.data.id;
        }
      } catch (e) {
        alert('Failed to create folder: ' + e.message);
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedImageMime = file.type;
      const reader = new FileReader();

      reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function () {
          // Canvas Compression
          const canvas = document.createElement('canvas');
          const maxDim = 1024;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('modalImgPreview').src = selectedImageBase64;
          document.getElementById('mediaModal').classList.remove('hidden');
        };
      };
      reader.readAsDataURL(file);
    }

    function closeModal() {
      document.getElementById('mediaModal').classList.add('hidden');
      document.getElementById('fileInput').value = '';
      selectedImageBase64 = null;
    }

    async function confirmMediaUpload() {
      const caption = document.getElementById('modalCaption').value;
      const folderId = document.getElementById('assetSelect').value;
      const imgData = selectedImageBase64;
      const mime = selectedImageMime;

      closeModal();
      document.getElementById('modalCaption').value = '';

      const msgId = appendMessage({ text: caption, img: imgData, isUser: true, status: '🕒' });
      saveChatHistory();

      try {
        updateProgress(msgId, 40, '✓');
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'processChat',
            prompt: caption,
            folderId: folderId,
            imageBase64: imgData,
            mimeType: mime
          })
        });

        updateProgress(msgId, 100, '✓✓');
        const result = await res.json();

        if (result.status === 'success') {
          appendMessage({ text: result.data.reply, isUser: false });
        } else {
          appendMessage({ text: 'Error: ' + result.message, isUser: false });
        }
      } catch (e) {
        appendMessage({ text: 'Network Error: ' + e.message, isUser: false });
      }
      saveChatHistory();
    }

    async function sendTextMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendMessage({ text: text, isUser: true, status: '✓✓' });
      saveChatHistory();

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'processChat',
            prompt: text
          })
        });
        const result = await res.json();
        if (result.status === 'success') {
          appendMessage({ text: result.data.reply, isUser: false });
        } else {
          appendMessage({ text: 'Error: ' + result.message, isUser: false });
        }
      } catch (e) {
        appendMessage({ text: 'Network Error: ' + e.message, isUser: false });
      }
      saveChatHistory();
    }

    function appendMessage({ text, img, isUser, status }) {
      const stream = document.getElementById('chatStream');
      const msgId = 'msg-' + Date.now();
      
      const align = isUser ? 'justify-end' : 'justify-start';
      const bubbleClass = isUser ? 'bubble-out' : 'bubble-in';

      let contentHtml = '';
      if (img) {
        contentHtml += `<img src="${img}" class="rounded mb-2 max-h-48 w-full object-cover">`;
      }
      
      contentHtml += `<div class="text-sm text-gray-800 break-words">${text}</div>`;

      if (!isUser && text.includes('<table')) {
        contentHtml += `
          <div class="mt-2 flex space-x-2">
            <button onclick="copyTableData(this)" class="bg-gray-100 hover:bg-gray-200 text-xs px-2 py-1 rounded border">📋 Copy</button>
            <button onclick="exportCSV(this)" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs px-2 py-1 rounded border">📥 CSV</button>
          </div>
        `;
      }

      const msgNode = document.createElement('div');
      msgNode.className = `flex ${align}`;
      msgNode.id = msgId;
      msgNode.innerHTML = `
        <div class="max-w-[80%] rounded-lg p-2.5 shadow ${bubbleClass} relative">
          ${contentHtml}
          <div class="flex items-center justify-end space-x-1 mt-1 text-[10px] text-gray-500">
            <span>${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            ${isUser ? `<span class="status-icon">${status || '✓'}</span>` : ''}
          </div>
        </div>
      `;

      stream.appendChild(msgNode);
      stream.scrollTop = stream.scrollHeight;
      return msgId;
    }

    function updateProgress(msgId, percent, statusSymbol) {
      const msg = document.getElementById(msgId);
      if (!msg) return;
      const statusIcon = msg.querySelector('.status-icon');
      if (statusIcon) statusIcon.innerText = statusSymbol;
    }

    function copyTableData(btn) {
      const table = btn.closest('.bubble-in').querySelector('table');
      if (table) {
        navigator.clipboard.writeText(table.innerText);
        alert('Table data copied!');
      }
    }

    function exportCSV(btn) {
      const table = btn.closest('.bubble-in').querySelector('table');
      if (!table) return;
      let csv = [];
      const rows = table.querySelectorAll('tr');
      for (let row of rows) {
        const cols = row.querySelectorAll('td, th');
        let rowData = [];
        for (let col of cols) rowData.push('"' + col.innerText.replace(/"/g, '""') + '"');
        csv.push(rowData.join(','));
      }
      const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Logsheet_Data_${Date.now()}.csv`;
      a.click();
    }

    function saveChatHistory() {
      const stream = document.getElementById('chatStream');
      localStorage.setItem('chat_history', stream.innerHTML);
    }

    function loadChatHistory() {
      const saved = localStorage.getItem('chat_history');
      if (saved) {
        document.getElementById('chatStream').innerHTML = saved;
      }
    }
  </script>
</body>
</html>
